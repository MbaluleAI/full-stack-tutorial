<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead CRM Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
        form { background: #f4f4f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .company { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <h2>Capture New Business Lead</h2>
    <form id="leadForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" required>
        </div>
        <button type="submit">Submit Lead</button>
    </form>

    <h2>Active Leads Pipeline</h2>
    <ul id="leadsList">Loading leads...</ul>

    <script>
        const API_URL = 'http://127.0.0';

        // 1. GET Request: Fetch and render data from the FastAPI backend
        async function fetchLeads() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const leads = await response.json();
                const listElement = document.getElementById('leadsList');
                listElement.innerHTML = ''; // Clear loading text

                leads.forEach(lead => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${lead.name}</strong> (${lead.email}) <span class="company">${lead.company}</span>`;
                    listElement.appendChild(li);
                });
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('leadsList').innerText = 'Failed to load leads.';
            }
        }

        // 2. POST Request: Send form data to backend API as JSON
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const leadData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                company: document.getElementById('company').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leadData)
                });

                if (response.ok) {
                    document.getElementById('leadForm').reset();
                    fetchLeads(); // Refresh list immediately without page reload
                } else {
                    alert('Error saving lead. Please check input formatting.');
                }
            } catch (error) {
                console.error('Submission error:', error);
            }
        });

        // Initialize leads on page load
        fetchLeads();
    </script>
</body>
</html>
